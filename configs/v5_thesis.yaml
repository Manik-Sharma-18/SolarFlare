# V5.0 Path B — THESIS RUN (full ViT-Small × 21 cubes × 50 epochs)
# Base: configs/v5_path_a.yaml. Three confirmed-wrong settings fixed:
#   1. Slow curriculum (0.25/0.40) — F1, F7 (was 0.10/0.20)
#   2. Uniform mask mix {0.34/0.33/0.33} — F11, E15/E26 (was tube-heavy 0.5/0.3/0.2)
#   3. EMA τ=0.990 — E17 winner (0.00761 vs E09 0.00831, monotonic to τ=0.9995=0.0301)
# Mask target_ratio=0.75 — E26 winner (0.00876 vs E25 0.00960, E27 0.01597; concave at 0.75)
# All ablation evidence at sanity scale (dim=192, 4 cubes). Full scale assumption.
# CUDA-5060ti-validated

data:
  zarr_dir: data/
  manifest_path: data/manifest.json
  t_in: 10
  t_out: 4
  pixel_scale_mm: 0.364
  cadence_min: 12
  norm: zscore_per_cube
  augment: d4_chiral
  splits: by_harp_id
  val_fraction: 0.2
  split_seed: 0
  num_workers: 4
  bucket_by_shape: true
  reject_window_with_time_zero: true

model:
  input_adapter:
    in_ch: 1
    out_ch: 13
    patch_size: 16
    pad_mode: constant
    valid_mask_routing: separate
  encoder:
    dim: 384
    layers: 12
    heads: 6
    mlp_ratio: 4
  predictor:
    layers: 6
    hidden: 384
    heads: 6
    mlp_ratio: 4
    dropout: 0.0
    drop_path: 0.1
    block_causal: true
    rope3d_units: physical
  pixel_decoder:
    enabled: false
  patch_size: 16
  masking:
    enabled: true
    policy_mix: {tube: 0.34, future: 0.33, cross_time: 0.33}
    tube_short_area: 0.15
    tube_long_area: 0.40
    future_pct: 0.30
    cross_time_pct: 0.30
    target_ratio: 0.75
    val_policy: tail
    valid_token_threshold: 0.5
    seed: 0
    curriculum:
      tail_only_pct: 0.25
      warmup_pct: 0.40

loss:
  primary: smooth_l1_embedding
  pixel_aux_weight: 0.0

training:
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.04
  lr: 3.0e-4
  schedule: cosine_warmup
  warmup_pct: 0.10
  min_lr_ratio: 0.01
  epochs: 80
  max_steps_per_epoch: 2000
  batch_size: 1
  grad_accum_steps: 4
  grad_clip: 1.0
  precision: bf16
  target_ema_decay: 0.990
  grad_checkpoint: true
  compile: "off"
  curriculum:
    one_step_pct: 0.30
    half_step_pct: 0.30
    full_step_pct: 0.40

logging:
  out_dir: outputs_v5_thesis/
  log_every: 10
  val_every_epoch: 1
  save_every_epoch: 1

device:
  prefer: cuda
