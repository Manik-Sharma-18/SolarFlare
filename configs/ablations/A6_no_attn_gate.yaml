# Ablation A6_no_attn_gate
# ablate AttentionGate on skip connection
# Baseline: configs/finetune_winding_flux.yaml
# Auto-generated by configs/ablations/build_configs.py — do not edit by hand.

device: auto
seed: 42
transfer_learning: null
data:
  loader: harp_zarr
  data_dir: ./data
  t_in: 10
  t_out: 4
  augmentation: balanced
  stride: 4
  split_ratios:
  - 0.7
  - 0.2
  - 0.1
  dual_channel: true
  num_workers: 0
  window_size: 128
  window_stride: 64
  clip: 1.0e8
  flare_oversample_weight: 5.0
  flare_density_threshold: 0.005
normalization:
  method: zscore_per_cube
  signed_asinh_softening: 1.0e6
  extreme_threshold_percentile: 99
model:
  input_channels: 2
  output_channels: 1
  channels:
  - 32
  - 64
  - 128
  kernel_size: 5
  downsample_input: false
  use_checkpointing: false
  dropout_rate: 0.15
  use_sa_convlstm: true
  delta_scale_init: 0.5
  attention_gate: false
  temporal_attention: true
training:
  batch_size: 1
  epochs: 30
  lr: 0.0001
  weight_decay: 1.0e-05
  tf_start: 0.0
  patience: 18
  use_amp: true
  grad_clip: 0.5
  scheduler:
    type: cosine
    cosine_eta_min: 1.0e-06
loss:
  type: composite
  l1_weight: 1.0
  ssim_weight: 0.3
  extreme_weight: 3.0
  extreme_pixel_weight: 25.0
  use_ms_ssim: false
  ssim_data_range: 2.0
  ssim_tiling_threshold: 256
  temporal_diff_weight: 1.0
  temporal_var_lambda: 0.1
  temporal_weights:
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  asymmetric_weight: 0.5
  asymmetric_alpha: 5.0
  extreme_threshold: 0.528
evaluation:
  extreme_threshold: 0.528
  verbose_metrics: false
output:
  save_dir: ./outputs/ablations/A6_no_attn_gate
  checkpoint_name: best_model.pt
  save_history: true
  save_visualizations: true
logging:
  progress_bar: true
  log_interval: 10
error_handling:
  max_consecutive_nan: 10
  grad_norm_warning_threshold: 100.0
  data_failure_threshold: 0.1
uncertainty:
  enabled: false
  n_samples: 20
  save_uncertainty_maps: true
resume_from: null
