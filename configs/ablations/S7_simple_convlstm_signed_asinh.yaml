# Ablation S7_simple_convlstm_signed_asinh
# S8 + signed_asinh normalization (heavy-tail compression) — does representation-level tail compression keep the field sharp where zscore+L1 smooths it?
# Baseline: configs/finetune_winding_flux.yaml
# Auto-generated by configs/ablations/build_configs.py — do not edit by hand.

device: auto
seed: 42
transfer_learning: null
data:
  loader: harp_zarr
  data_dir: ./data
  t_in: 10
  t_out: 4
  augmentation: none
  stride: 4
  split_ratios:
  - 0.9
  - 0.05
  - 0.05
  dual_channel: false
  num_workers: 0
  window_size: 64
  window_stride: 64
  clip: 1.0e8
  flare_oversample_weight: 5.0
  flare_density_threshold: 0.005
  test_cubes:
  - harp_245
  - harp_274
  - harp_49
normalization:
  method: signed_asinh
  signed_asinh_softening: 1000000.0
  extreme_threshold_percentile: 99
model:
  kind: simple_convlstm
  input_channels: 1
  output_channels: 1
  hidden_dim: 64
  num_layers: 2
  kernel_size: 3
  residual: true
  norm_type: group
training:
  batch_size: 8
  epochs: 15
  lr: 0.001
  weight_decay: 1.0e-05
  tf_start: 1.0
  patience: 3
  use_amp: false
  grad_clip: 0.5
  scheduler:
    type: cosine
    cosine_eta_min: 1.0e-06
loss:
  type: l1
evaluation:
  extreme_threshold: 0.0346
  verbose_metrics: false
output:
  save_dir: ./outputs/ablations/S7_simple_convlstm_signed_asinh
  checkpoint_name: best_model.pt
  save_history: true
  save_visualizations: true
logging:
  progress_bar: true
  log_interval: 10
error_handling:
  max_consecutive_nan: 10
  grad_norm_warning_threshold: 100.0
  data_failure_threshold: 0.1
uncertainty:
  enabled: false
  n_samples: 20
  save_uncertainty_maps: true
resume_from: null
