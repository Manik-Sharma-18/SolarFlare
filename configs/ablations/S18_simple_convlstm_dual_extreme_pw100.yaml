# Ablation S18_simple_convlstm_dual_extreme_pw100
# Combine S16's extreme_pixel_weight=25 with S13's pos_weight=100.
# S16 (ext_w 25, pos_w 60) → SOTA: test cls CSI 0.0562, reg CSI 0.0255 (beats persistence 0.043 by 31%)
# S13 (ext_w 0, pos_w 100) → cls CSI 0.0434 (matches persistence)
# Hypothesis: pos_w 100 strengthens classifier (S13 had 0.0434 cls vs S16 0.0562 — classifier weaker
# in S16 due to lower pos_w). If pos_w 100 + ext_w 25 are additive, expect cls > 0.06, reg > 0.025.
# Risk: pos_w 100 may starve regression again even with extreme_pixel_weight rescue.

device: auto
seed: 42
transfer_learning: null
data:
  loader: harp_zarr
  data_dir: ./data
  t_in: 10
  t_out: 4
  augmentation: none
  stride: 4
  split_ratios:
  - 0.9
  - 0.05
  - 0.05
  dual_channel: false
  num_workers: 0
  window_size: 64
  window_stride: 64
  clip: 1.0e8
  flare_oversample_weight: 5.0
  flare_density_threshold: 0.005
  test_cubes:
  - harp_245
  - harp_274
  - harp_49
normalization:
  method: zscore_per_cube
  signed_asinh_softening: 1.0e6
  extreme_threshold_percentile: 99
model:
  kind: simple_convlstm
  input_channels: 1
  output_channels: 1
  hidden_dim: 64
  num_layers: 2
  kernel_size: 3
  residual: true
  norm_type: group
  enable_classifier_head: true
training:
  batch_size: 8
  epochs: 15
  lr: 0.001
  weight_decay: 1.0e-05
  tf_start: 1.0
  patience: 8
  use_amp: false
  grad_clip: 0.5
  scheduler:
    type: constant
  tf_decay_epochs: 5
loss:
  type: dual_head
  alpha: 1.0
  beta: 1.0
  pos_weight: 100.0
  extreme_threshold: 0.528
  classification_loss: bce
  extreme_pixel_weight: 25.0
evaluation:
  extreme_threshold: 0.528
  verbose_metrics: false
output:
  save_dir: ./outputs/ablations/S18_simple_convlstm_dual_extreme_pw100
  checkpoint_name: best_model.pt
  save_history: true
  save_visualizations: true
logging:
  progress_bar: true
  log_interval: 10
error_handling:
  max_consecutive_nan: 10
  grad_norm_warning_threshold: 100.0
  data_failure_threshold: 0.1
uncertainty:
  enabled: false
  n_samples: 20
  save_uncertainty_maps: true
resume_from: null
