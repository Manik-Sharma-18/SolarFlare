# V5.0 Path B — THESIS RUN curated split (E30).
# Replaces E29b (21 cubes, 30 ep, val plateau 0.034 by ep17 — 3.5× thinner per-cube
# coverage than E15 sanity made multi-cube generalization stall).
# Strategy: shrink to 13 train cubes (2.7× more steps/cube), 50 ep budget,
#   reserve 5 cubes for unseen-AR probe holdout (never seen by encoder).
#
# Split design (stratified by H×W bin: S<30k, M 30k-150k, L 150k-400k, XL>400k):
#   TRAIN (13): all 4 XL-class denied to val so encoder sees max-resolution diversity;
#               keep harp_8 for clip-edge signal; keep harp_45/26/116 for long sequences.
#   VAL (3, ckpt selection): one S, one XL, one mid-large.
#   HOLDOUT (5, probe-only): harp_17 (E11 anchor), harp_51 (E11 wind probe target),
#               harp_may2024, harp_nov2025, harp_245 (longest 1472f).
#
# Compute: 100 ep × 2000 steps / 13 cubes = 15.4K steps/cube (vs E29b 1.4K, E15 sanity 5K).
# Per-step rate 0.84s observed at ep0 (5.8× faster than E29b — XL cubes excluded shrinks
# bucketed-sampler batch sizes). ETA 100 × (2000×0.84 + 200val) = 52h ≈ 2.2d.
# Done ~May 18 05:00 → 2.5d buffer for probe + writeup vs May 20 deadline.
# Winners applied: slow curric (F1/F7), uniform mask {0.34/0.33/0.33} (F11),
#   τ=0.990 (E17 winner), target_ratio=0.75 (E26 winner).
# CUDA-5060ti-validated

data:
  zarr_dir: data/
  manifest_path: data/manifest.json
  t_in: 10
  t_out: 4
  pixel_scale_mm: 0.364
  cadence_min: 12
  norm: zscore_per_cube
  augment: d4_chiral
  splits: by_harp_id
  val_fraction: 0.2  # ignored when train_cubes/val_cubes set
  split_seed: 0
  num_workers: 4
  bucket_by_shape: true
  reject_window_with_time_zero: true
  train_cubes:
    - harp_219
    - harp_316
    - harp_83
    - harp_45
    - harp_318
    - harp_43
    - harp_26
    - harp_116
    - harp_49
    - harp_156
    - harp_8
    - harp_274
    - harp_54
  val_cubes:
    - harp_221
    - harp_11930
    - harp_86
  # Holdout (never given to JEPA, used only by probe stage):
  #   harp_17, harp_51, harp_may2024, harp_nov2025, harp_245

model:
  input_adapter:
    in_ch: 1
    out_ch: 13
    patch_size: 16
    pad_mode: constant
    valid_mask_routing: separate
  encoder:
    dim: 384
    layers: 12
    heads: 6
    mlp_ratio: 4
  predictor:
    layers: 6
    hidden: 384
    heads: 6
    mlp_ratio: 4
    dropout: 0.0
    drop_path: 0.1
    block_causal: true
    rope3d_units: physical
  pixel_decoder:
    enabled: false
  patch_size: 16
  masking:
    enabled: true
    policy_mix: {tube: 0.34, future: 0.33, cross_time: 0.33}
    tube_short_area: 0.15
    tube_long_area: 0.40
    future_pct: 0.30
    cross_time_pct: 0.30
    target_ratio: 0.75
    val_policy: tail
    valid_token_threshold: 0.5
    seed: 0
    curriculum:
      tail_only_pct: 0.25
      warmup_pct: 0.40

loss:
  primary: smooth_l1_embedding
  pixel_aux_weight: 0.0

training:
  optimizer: adamw
  betas: [0.9, 0.999]
  weight_decay: 0.04
  lr: 3.0e-4
  schedule: cosine_warmup
  warmup_pct: 0.10
  min_lr_ratio: 0.01
  epochs: 100
  max_steps_per_epoch: 2000
  batch_size: 1
  grad_accum_steps: 4
  grad_clip: 1.0
  precision: bf16
  target_ema_decay: 0.990
  grad_checkpoint: true
  compile: "off"
  curriculum:
    one_step_pct: 0.30
    half_step_pct: 0.30
    full_step_pct: 0.40

logging:
  out_dir: outputs_v5_thesis_curated/
  log_every: 10
  val_every_epoch: 1
  save_every_epoch: 1

device:
  prefer: cuda
