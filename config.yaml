# Solar Flare Prediction Model Configuration
# ============================================

device: "auto"              # "auto" (detect best), "cuda", "mps", or "cpu"

seed: 42                    # Random seed for reproducibility (torch, numpy, python random)

resume_from: null           # Path to checkpoint file to resume training from (null = start fresh)

data:
  data_dir: "./data"      # Path to directory containing raw .npy files
  use_preprocessed: true  # Set to true to use preprocessed cubes (faster loading)
  preprocessed_dir: "./data_processed"  # Path to preprocessed cube files
  t_in: 10                # Number of input timesteps
  t_out: 4                # Number of output timesteps to predict
  augmentation: "none"       # "none", "balanced" (h/v flips), or "aggressive" (flips + rotations)
  stride: 2               # Sliding window stride (1 = maximum overlap, higher = fewer samples)
  split_ratios: [0.7, 0.2, 0.1]  # Train/test/val split ratios (whole-file assignment)
  dual_channel: true      # Enable dual-channel mode (flux + extreme indicator)
  num_workers: 0          # DataLoader workers (0 = main process only, >0 = multiprocessing)
  target_size: [448, 896] # Resize all samples to uniform (H, W) for batch_size > 1
  # Oversample flare-containing sequences (1.0 = disabled, 3.0 = 3x oversampling)
  flare_oversample_weight: 1.0
  flare_density_threshold: 0.02  # Fraction of pixels above extreme threshold to flag as flare (0.02 = 2%)

normalization:
  method: "asinh"         # "asinh" (recommended), "robust", or "fixed"
  asinh_softening: 1000.0 # Softening parameter for asinh (higher = less compression)
  extreme_threshold_percentile: 99  # Percentile for extreme event detection
  # Legacy options (for method: "robust" or "fixed")
  fixed_factor: 40000.0   # Only used if method is "fixed"
  percentile_low: 1       # Lower percentile for robust normalization
  percentile_high: 99     # Upper percentile for robust normalization

model:
  input_channels: 2       # 1 for single-channel, 2 for dual-channel (flux + extreme)
  output_channels: 1      # Output channels (typically 1 for flux prediction)
  channels: [32, 64, 128]  # ARCH-04: Channel progression (widened from [16, 32, 64])
  kernel_size: 5          # ARCH-05: Kernel size (increased from 3)
  downsample_input: true  # Apply 2x spatial downsampling at input (saves VRAM)
  use_checkpointing: false # Gradient checkpointing (saves ~40% VRAM, ~20% slower)
  dropout_rate: 0.15      # ARCH-06: MC Dropout for regularization (increased from 0.0)
  # v3.0 architecture features
  use_sa_convlstm: true    # ARCH-01: SA-ConvLSTM cells with Self-Attention Memory
  delta_scale_init: 100.0  # ARCH-02: Learned delta head scaling (0.0 = disabled)
  attention_gate: true     # ARCH-03: Spatial attention gates on skip connections
  temporal_attention: true # ARCH-07: Temporal attention over encoder hidden states

training:
  batch_size: 4           # Batch size (target_size enables uniform spatial dims)
  epochs: 25              # Number of training epochs
  lr: 0.0001               # Learning rate
  weight_decay: 0.00001   # L2 regularization
  tf_start: 0.0           # Initial teacher forcing ratio
  patience: 18            # Early stopping patience
  use_amp: true            # Use automatic mixed precision (faster, less VRAM)
  grad_clip: 0.5          # Gradient clipping max norm
  
  # Learning rate scheduler configuration
  scheduler:
    type: "cosine"        # Options: "cosine", "step", "constant", "none"
    # Cosine annealing options
    cosine_eta_min: 0.000001  # Minimum LR for cosine (default: 1e-6)
    # Step scheduler options  
    step_size: 10         # Epochs between LR decay (for type: "step")
    step_gamma: 0.5       # LR decay factor (for type: "step")

# Loss function configuration
loss:
  type: "composite"       # "l1", "composite", or "weighted"
  l1_weight: 1.0          # Weight for L1 (MAE) loss
  ssim_weight: 0.3        # Weight for SSIM loss (as 1 - SSIM), reduced from 0.5 per research
  extreme_weight: 3.0     # Weight for extreme value weighted loss (LOSS-06: increased from 1.0)
  use_ms_ssim: false       # Use multi-scale SSIM (better for larger images)
  ssim_data_range: 2.0    # Data range for SSIM (2.0 for normalized [-1,1])
  ssim_tiling_threshold: 256  # Tile SSIM computation for spatial dims above this (prevents OOM on 512x512+)
  # v3.0 temporal dynamics and extreme penalty
  temporal_diff_weight: 1.0  # Weight for temporal difference loss (equal to L1)
  temporal_var_lambda: 0.1   # Lambda for temporal variation penalty (gentle nudge)
  temporal_weights: [1.0, 1.5, 2.0, 2.5]  # Per-timestep weighting (linear ramp)
  asymmetric_weight: 0.5    # Weight for asymmetric extreme loss
  asymmetric_alpha: 2.0     # Underestimation costs 2x overestimation above threshold
  extreme_threshold: 0.277 # 99th percentile in normalized asinh space (~17,400 raw)

# Evaluation metrics configuration
evaluation:
  extreme_threshold: 0.277    # 99th percentile in normalized asinh space (~17,400 raw)
  verbose_metrics: false        # Print per-timestep breakdown every epoch (vs only final)

output:
  save_dir: "./outputs"   # Directory for checkpoints and logs
  checkpoint_name: "best_model.pt"
  save_history: true      # Save training history JSON
  save_visualizations: true

logging:
  progress_bar: true      # Show tqdm progress bars
  log_interval: 10        # Log every N batches (if progress_bar is false)

# Error handling thresholds
error_handling:
  max_consecutive_nan: 10       # Abort training after N consecutive NaN batches
  grad_norm_warning_threshold: 100.0  # Log warning when gradient norm exceeds this
  data_failure_threshold: 0.1   # Abort if more than this fraction of data files fail (0.1 = 10%)

# Uncertainty quantification (MC Dropout)
uncertainty:
  enabled: false          # Enable uncertainty estimation during inference
  n_samples: 20           # Number of MC dropout samples (more = better estimate, slower)
  save_uncertainty_maps: true  # Save uncertainty visualization images
